name: Composition Lab 3.5.3 macOS verification
on:
  push:
    branches: [release/v3.5.3-engine-2.3.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and isolated motif path
        shell: bash
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)" = "3.5.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)" = "3503"
          grep -q 'Motivauftrag und Kompositionsidee vorbereitet' Sources/MainViewController.swift
          grep -q 'static let referenceVersion = "2.3.1"' Sources/Models.swift
          grep -q 'static func compositionPrompt' Sources/Models.swift
          ! grep -q 'musicalDraftPrompt' Sources/Models.swift
          ! grep -q 'composition.musical-draft' Sources/MainViewController.swift
          ! grep -q 'python3 Apply' 'Build Native App.command'
      - name: Build Intel and Apple Silicon
        shell: bash
        run: |
          chmod +x 'Build Native App.command'
          ./Build\ Native\ App.command
          test -f 'Composition Lab.app/Contents/MacOS/Composition Lab'
          file 'Composition Lab.app/Contents/MacOS/Composition Lab'
          lipo 'Composition Lab.app/Contents/MacOS/Composition Lab' -verify_arch x86_64 arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'Composition Lab.app/Contents/Info.plist')" = "3.5.3"
      - name: Package app without replacing installed version
        shell: bash
        run: |
          ditto -c -k --keepParent 'Composition Lab.app' Composition-Lab-V3.5.3-Build3503.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Composition-Lab-V3.5.3-Build3503
          path: Composition-Lab-V3.5.3-Build3503.zip
