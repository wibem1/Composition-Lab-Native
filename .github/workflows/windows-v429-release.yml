name: Windows 4.2.10 end-to-end and release
on:
  workflow_dispatch:
  push:
    branches: [v4-cross-platform]
    paths:
      - 'Windows/**'
      - 'Shared/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/windows-v429-release.yml'
permissions:
  contents: write
  actions: read
jobs:
  regression:
    uses: ./.github/workflows/v4-core.yml
  native-windows:
    needs: regression
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Windows archive from regression job
        uses: actions/download-artifact@v4
        with:
          name: Composition-Lab-4.2.10-Windows-x64
          path: .
      - name: Download matching native and extracted-package test evidence
        uses: actions/download-artifact@v4
        with:
          name: Windows-Starttest
          path: Windows/TestResults
      - name: Require complete test evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'Windows/TestResults'
          foreach ($sub in @('', 'Packaged')) {
            $dir = Join-Path $base $sub
            $result = Get-Content (Join-Path $dir 'result.json') -Raw | ConvertFrom-Json
            if (-not $result.passed) { throw "Native self-test failed for $dir" }
            $p = Get-Content (Join-Path $dir 'Pastorale-Messung.json') -Raw | ConvertFrom-Json
            if ($null -eq $p) { throw "Pastorale results absent for $dir" }
            $r = Get-Content (Join-Path $dir 'Romanze-Messung.json') -Raw | ConvertFrom-Json
            if (-not $r.passed -or $r.pages -lt 1 -or $r.bars -ne 37) { throw "Romanze A4 regression failed for $dir" }
            $guile = Get-Content (Join-Path $dir 'Guile-Extraction-Repair.json') -Raw | ConvertFrom-Json
            if (-not $guile.passed -or $guile.verifiedPairs -ne 374 -or -not $guile.simulatedUserExtraction) { throw "Guile corruption/repair test failed for $dir" }
          }
          if (-not (Test-Path 'Composition-Lab-4.2.10-Windows-x64.zip')) { throw 'Package missing' }
      - name: Store installable archive and logs
        uses: actions/upload-artifact@v4
        with:
          name: Composition-Lab-4.2.10-Windows-verified
          path: |
            Composition-Lab-4.2.10-Windows-x64.zip
            Windows/TestResults/**
          if-no-files-found: error
      - name: Publish only fully tested release
        if: ${{ success() && github.ref == 'refs/heads/v4-cross-platform' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item 'Windows/TestResults/Packaged/Romanze.ly' 'Romanze-Bassoktaven-korrigiert.ly'
          Copy-Item 'Windows/TestResults/Packaged/Romanze.mid' 'Romanze-Bassoktaven-korrigiert.mid'
          gh release create v4.2.10 'Composition-Lab-4.2.10-Windows-x64.zip' 'Romanze-Bassoktaven-korrigiert.ly' 'Romanze-Bassoktaven-korrigiert.mid' --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Composition Lab Windows v4.2.10' --notes 'Windows application passed native Pastorale and original Romanze A4 processing plus extracted-ZIP regression tests with deliberately inverted Guile timestamps. See workflow run ${{ github.run_id }}.'
