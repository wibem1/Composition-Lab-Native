name: Windows slot persistence compile check
on:
  push:
    branches:
      - fix/windows-slot-recovery-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows application
        run: dotnet build Windows/CompositionLab/CompositionLab.csproj --configuration Release
