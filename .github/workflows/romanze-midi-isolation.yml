name: Romanze MIDI isolation
on:
  push:
    branches: [v4-cross-platform]
    paths: ['.github/workflows/romanze-midi-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/wibem1/Composition-Lab-Native/releases/download/v4.2.9/Composition-Lab-4.2.9-Windows-x64.zip' -OutFile app.zip
          Expand-Archive app.zip bundle
          $app = (Resolve-Path 'bundle/Composition Lab 4.2.9').Path
          $lily = Join-Path $app 'LilyPond'
          $manifest = Get-Content 'Windows/CompositionLab/GuileRuntimeManifest.json' -Raw | ConvertFrom-Json
          foreach ($pair in $manifest.pairs) {
            $source = Get-Item (Join-Path $lily $pair.source)
            (Get-Item (Join-Path $lily $pair.compiled)).LastWriteTimeUtc = $source.LastWriteTimeUtc.AddSeconds(4)
          }
          $env:FONTCONFIG_FILE = Join-Path $lily 'etc/fonts/fonts.conf'
          $env:FONTCONFIG_PATH = Join-Path $lily 'etc/fonts'
          New-Item audit -ItemType Directory | Out-Null
          & (Join-Path $lily 'bin/lilypond.exe') --svg -dpoint-and-click --output=audit/romanze 'Tests/CompositionCoreTests/Fixtures/romanze-violin-piano-a4.ly' 2>&1 | Tee-Object audit/engraving.log
          if ($LASTEXITCODE -ne 0) { throw 'Engraving failed' }
          & (Join-Path $app 'Core/composition-lab-core.exe') midi-to-score audit/romanze.midi audit/score.json 2>&1 | Tee-Object audit/import.log
          Write-Output "Core import exit: $LASTEXITCODE"
          python -m pip install mido==1.3.3
          @'
          import mido,json
          m=mido.MidiFile('audit/romanze.midi')
          for ti,t in enumerate(m.tracks):
              tick=0;notes=[];active={};bad=[];programs={}
              for e in t:
                  tick+=e.time
                  if e.type=='program_change': programs[e.channel]=e.program
                  if e.type=='note_on' and e.velocity>0: active.setdefault((e.channel,e.note),[]).append((tick,e.velocity))
                  if e.type=='note_off' or (e.type=='note_on' and e.velocity==0):
                      a=active.get((e.channel,e.note),[])
                      if a:
                          start,vel=a.pop(0);notes.append([start,tick-start,e.note,vel])
              print(json.dumps({'track':ti,'programs':programs,'notes':len(notes),'minPitch':min((n[2] for n in notes),default=0),'maxPitch':max((n[2] for n in notes),default=0),'minVelocity':min((n[3] for n in notes),default=0),'maxVelocity':max((n[3] for n in notes),default=0),'end':tick/m.ticks_per_beat,'unclosed':len(active),'zeroDuration':sum(n[1]==0 for n in notes)}))
          '@ | python -
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Romanze-MIDI-audit
          path: audit/
