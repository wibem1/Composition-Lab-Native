name: Composition Lab Native quality gates
on:
  push:
    branches: [v4-cross-platform]
  pull_request:
    branches: [v4-cross-platform]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  COMPOSITION_LAB_BACKUP_FIXTURE: ${{ github.workspace }}/Tests/CompositionCoreTests/Fixtures/backup-compatibility.json
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift 6.1.2 on macOS and Linux
        if: runner.os != 'Windows'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1.2'
      - name: Swift 6.1.2 on Windows
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - run: swift --version
      - run: swift test
      - run: swift build -c release
      - run: swift run -c release composition-lab-core --version
      - name: Build isolated Mac application
        if: runner.os == 'macOS'
        run: |
          bash 'Build Native App.command'
          test -x 'Composition Lab 4.2.app/Contents/MacOS/Composition Lab 4.2'
          lipo 'Composition Lab 4.2.app/Contents/MacOS/Composition Lab 4.2' -verify_arch x86_64 arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' 'Composition Lab 4.2.app/Contents/Info.plist')" = 'de.klangwerke.compositionlab.native.v4'
          COMPOSITION_LAB_TEST_DOMAIN=de.klangwerke.compositionlab.ci 'Composition Lab 4.2.app/Contents/MacOS/Composition Lab 4.2' --native-self-test "$PWD/Mac-TestResults"
          test -s Mac-TestResults/result.json
          'Composition Lab 4.2.app/Contents/MacOS/Composition Lab 4.2' --capture-gui-reference "$PWD/Mac-GUI-Reference"
          test -s Mac-GUI-Reference/Mac-Main.png
          ditto -c -k --keepParent 'Composition Lab 4.2.app' Composition-Lab-4.2-Mac.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Composition-Lab-4.2-Mac
          path: Composition-Lab-4.2-Mac.zip
          if-no-files-found: error
      - name: Build Windows desktop and test bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Windows/Build.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Composition-Lab-4.2-Windows-x64
          path: Composition-Lab-4.2-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-Starttest
          path: Windows/TestResults/

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: Mac-GUI-Reference
          path: Mac-GUI-Reference/

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: Mac-TestResults
          path: Mac-TestResults/
