name: Local LilyPond startup investigation
on:
  push:
    branches: [v4-cross-platform, fix/local-lilypond-startup]
    paths: ['Tools/Windows/**', '.github/workflows/local-lilypond-investigation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  local-runtime:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[validate existing outputs]')
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-gettext
      - name: Build GLib with lazy Windows application enumeration
        shell: msys2 {0}
        run: bash Tools/Windows/build-lazy-gio.sh
      - name: Compare original and candidate on local notation jobs
        shell: pwsh
        run: ./Tools/Windows/Test-LocalLilyPond.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Local-LilyPond-Investigation
          path: |
            RuntimeReports/
            RuntimeCandidate/
            RuntimeControl/
            runtime-source/build/meson-logs/meson-log.txt
          if-no-files-found: warn

  validate-existing-outputs:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[validate existing outputs]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Local-LilyPond-Investigation
          run-id: 39568896709
          github-token: ${{ github.token }}
          path: SavedOutputs
      - run: python Tools/Windows/Validate-LocalOutputs.py SavedOutputs/RuntimeReports
      - uses: actions/upload-artifact@v4
        with:
          name: Validated-Local-LilyPond-Comparison
          path: SavedOutputs/RuntimeReports/validated-comparison.json
